{% extends "base.html" %}
{% block title %}{{ title }} · SchoolBBS{% endblock %}
{% block content %}
<div class="form-shell narrow-form">
  <a class="back-link" href="{% if post %}{% url 'post_detail' post.pk %}{% else %}{% url 'home' %}{% endif %}">{% include "forum/_icon.html" with name="back" %}返回首页</a>
  <section class="page-heading form-heading"><div><p class="eyebrow">MAKE IT CLEAR</p><h1>{{ title }}<span class="brand-dot">.</span></h1></div></section>
  <form method="post" class="form-card stack">
    {% csrf_token %}{{ form.as_div }}
    <div class="form-actions"><a class="button ghost-button" href="{% if post %}{% url 'post_detail' post.pk %}{% else %}{% url 'home' %}{% endif %}">取消</a><button class="button" type="submit">保存修改</button></div>
  </form>
</div>
{% endblock %}
