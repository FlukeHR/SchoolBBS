{% extends "base.html" %}
{% block title %}搜索 · SchoolBBS{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">站内检索</p><h1>搜索帖子</h1></div></section>
<form method="get" class="search-form" role="search">
  <label class="sr-only" for="q">搜索标题和正文</label>
  <input id="q" name="q" value="{{ query }}" maxlength="100" placeholder="输入关键词" required>
  <button class="button" type="submit">搜索</button>
</form>
{% if query %}
  <p class="muted">“{{ query }}”的搜索结果</p>
  {% include "forum/_post_list.html" %}
{% endif %}
{% endblock %}
