{% extends "base.html" %}
{% block title %}注册 · SchoolBBS{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro">
    <p class="eyebrow">COME SAY HELLO</p>
    <h2>新的校园对话，<br>从你开始<span class="brand-dot">.</span></h2>
    <p>不必等到有完美的表达。<br>一个真实的问题，就很好。</p>
    {% include "forum/_campus_sticker.html" %}
  </div>
  <div class="auth-card">
    <p class="eyebrow">JOIN SCHOOLBBS</p>
    <h1>创建账号</h1>
    <p class="auth-subtitle">用户名注册后不可修改，昵称可以随时更新。</p>
    <form method="post" class="stack">
      {% csrf_token %}
      {{ form.as_div }}
      <button class="button auth-button" type="submit">注册并登录{% include "forum/_icon.html" with name="arrow" %}</button>
    </form>
    <p class="auth-switch">已有账号？<a href="{% url 'login' %}">返回登录</a></p>
  </div>
</section>
{% endblock %}
