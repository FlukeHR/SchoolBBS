<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的交易 - 校园贴吧</title>
  <link rel="stylesheet" href="css/universal.css" />
  <link rel="stylesheet" href="css/modern-components.css" />
  <link rel="stylesheet" href="css/trade.css" />
  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/modern-interactions.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>我的交易</h1>
    <p>管理我发布的二手交易</p>
  </div>

  <div class="topnav">
    <ul>
      <li><a href="home.jsp">主页</a></li>
      <li><a href="trade.html#discover">发现</a></li>
      <li><a href="trade.html#publish">发布</a></li>
    </ul>
  </div>

  <div class="row" id="mine">
    <div class="card">
      <h3>我发布的交易</h3>
      <div id="mineList" class="market-grid"></div>
    </div>
  </div>

  <script>
    async function fetchMine() {
      const wrap = document.getElementById('mineList');
      wrap.innerHTML = '';
      try {
        const res = await fetch('TradeMine');
        if (res.status === 401) {
          alert('请先登录');
          window.location.href = 'index.html';
          return;
        }
        if (!res.ok) throw new Error('网络错误');
        const list = await res.json();
        if (!list || !list.length) {
          wrap.innerHTML = '<div class="empty">暂无发布</div>';
          return;
        }
        list.forEach(it => wrap.appendChild(renderItem(it)));
      } catch (e) {
        wrap.innerHTML = '<div class="empty">加载失败</div>';
      }
    }

    function renderItem(item) {
      const el = document.createElement('div');
      el.className = 'item';

      const images = (item.images ? String(item.images).split(',').filter(Boolean) : (item.img ? [item.img] : []));
      const first = images[0];

      el.innerHTML = `
        <div class="thumb">${first ? `<img src="${first}" alt="">` : '<div class="ph">无图</div>'}</div>
        <div class="meta">
          <div class="t"><input class="f-title" value="${escapeHtml(item.title)}" disabled style="width:100%;"></div>
          <div class="p">￥<input class="f-price" type="number" min="0" step="0.01" value="${item.price ?? 0}" disabled style="width:120px;"></div>
          <div class="d"><textarea class="f-desc" rows="3" disabled style="width:100%;">${escapeHtml(item.description||'')}</textarea></div>
          <div class="time">${formatTime(item.date)} · ${escapeHtml(item.author||'')}
            <div style="margin-top:6px;">
              <label>图片列表(逗号分隔)：</label>
              <input class="f-images" value="${escapeAttr(item.images||'')}" disabled style="width:100%;" placeholder="/uploads/trade/a.jpg,/uploads/trade/b.png">
            </div>
            <div style="margin-top:8px;display:flex;gap:8px;">
              <button class="btn-edit">编辑</button>
              <button class="btn-save" style="display:none;">保存</button>
              <button class="btn-cancel" style="display:none;">取消</button>
              <button class="btn-del" data-id="${item.id}">删除</button>
            </div>
          </div>
        </div>`;

      const title = el.querySelector('.f-title');
      const price = el.querySelector('.f-price');
      const desc = el.querySelector('.f-desc');
      const imgs = el.querySelector('.f-images');

      const btnEdit = el.querySelector('.btn-edit');
      const btnSave = el.querySelector('.btn-save');
      const btnCancel = el.querySelector('.btn-cancel');
      const btnDel = el.querySelector('.btn-del');

      function setEditing(on) {
        [title, price, desc, imgs].forEach(inp => inp.disabled = !on);
        btnEdit.style.display = on ? 'none' : '';
        btnSave.style.display = on ? '' : 'none';
        btnCancel.style.display = on ? '' : 'none';
      }

      btnEdit.addEventListener('click', ()=> setEditing(true));
      btnCancel.addEventListener('click', ()=> {
        // 恢复原值
        title.value = item.title || '';
        price.value = item.price || 0;
        desc.value = item.description || '';
        imgs.value = item.images || '';
        setEditing(false);
      });
      btnSave.addEventListener('click', async ()=>{
        try {
          const body = new URLSearchParams();
          body.set('id', item.id);
          body.set('title', title.value.trim());
          body.set('price', price.value);
          body.set('desc', desc.value.trim());
          body.set('images', imgs.value.trim());
          const res = await fetch('TradeUpdate', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body});
          const j = await res.json();
          if (!j.ok) throw new Error(j.msg||'保存失败');
          alert('已保存');
          setEditing(false);
          fetchMine();
        } catch (e) {
          alert('保存失败');
        }
      });
      btnDel.addEventListener('click', async ()=>{
        if (!confirm('确认删除？')) return;
        try {
          const res = await fetch('TradeDelete', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'id='+encodeURIComponent(item.id)});
          const j = await res.json();
          if (!j.ok) throw new Error();
          fetchMine();
        } catch(e) {
          alert('删除失败');
        }
      });

      return el;
    }

    function escapeHtml(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function escapeAttr(s){ if(!s) return ''; return String(s).replace(/"/g,'&quot;'); }
    function formatTime(t){ if(!t) return ''; try { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; } catch(_) { return t; } }

    fetchMine();
  </script>

  <div class="footer">
    <h2>Nothing Is Impossible</h2>
  </div>
</div>
</body>
</html>
