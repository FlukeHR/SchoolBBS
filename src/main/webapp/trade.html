<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="rogepi" />
  <title>二手交易平台 - 校园贴吧</title>
  <link rel="icon" href="images/trade.png" type="image/x-icon" />
  <link rel="stylesheet" href="css/universal.css" />
  <link rel="stylesheet" href="css/modern-components.css" />
  <link rel="stylesheet" href="css/trade.css" />
  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/modern-interactions.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>二手交易平台</h1>
    <p>闲置不闲，循环更美好</p>
  </div>

  <div class="topnav">
    <ul>
      <li><a href="home.jsp">主页</a></li>
      <li><a href="#discover" id="navDiscover">发现</a></li>
      <li><a href="#publish" id="navPublish">发布</a></li>
      <li><a href="#recharge" id="navRecharge">充值</a></li>
      <li><a href="#purchase-history" id="navPurchaseHistory">购买记录</a></li>
      <li id="balanceDisplay" style="color: #4caf50; font-weight: bold;">余额: ¥0.00</li>
    </ul>
  </div>

  <div class="row" id="publish">
    <div class="card">
      <h3>发布出售信息</h3>
      <div class="trade-form">
        <form id="sellForm" action="TradeCreate" method="post" enctype="multipart/form-data">
          <label>商品标题：<input type="text" id="title" name="title" required></label>
          <label>价格（元）：<input type="number" id="price" name="price" min="0" step="0.01" required></label>
          <label>商品描述：<textarea id="desc" name="desc" rows="5" required></textarea></label>
          <label>上传图片（可选）：
            <input type="file" id="images" name="images" accept="image/*" multiple>
            <div id="preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;"></div>
          </label>
          <button type="submit">发布</button>
        </form>
      </div>
    </div>
  </div>

  <div class="row" id="recharge">
    <div class="card">
      <h3>账户充值</h3>
      <div class="recharge-form">
        <div class="balance-info">
          <p>当前余额: <span id="currentBalance">¥0.00</span></p>
        </div>
        
        <form id="rechargeForm">
          <label>充值金额（元）：
            <select id="rechargeAmount">
              <option value="10">¥10</option>
              <option value="50">¥50</option>
              <option value="100" selected>¥100</option>
              <option value="200">¥200</option>
              <option value="500">¥500</option>
              <option value="custom">自定义金额</option>
            </select>
          </label>
          
          <div id="customAmountDiv" style="display:none;">
            <label>自定义金额：<input type="number" id="customAmount" min="1" max="10000" step="0.01" placeholder="请输入金额"></label>
            <button type="button" onclick="testInvalidAmount()" style="margin-left:10px;padding:4px 8px;font-size:12px;background:#f44336;color:white;border:none;border-radius:4px;">测试格式错误</button>
          </div>
          
          <label>支付方式：
            <div class="payment-methods">
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="WECHAT" checked>
                <span class="payment-icon">💚</span> 微信支付
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="ALIPAY">
                <span class="payment-icon">💙</span> 支付宝
              </label>
            </div>
          </label>
          
          <button type="submit">立即充值</button>
        </form>
        
        <div class="recharge-history">
          <h4>充值记录</h4>
          <div id="historyList">
            <p>暂无充值记录</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row" id="purchase-history">
    <div class="card">
      <h3>我的购买记录</h3>
      <div class="purchase-history-content">
        <div class="purchase-stats">
          <div class="stat-item">
            <span class="stat-number" id="totalPurchases">0</span>
            <span class="stat-label">已购买</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" id="totalSpent">¥0.00</span>
            <span class="stat-label">总花费</span>
          </div>
        </div>
        
        <div class="purchase-filter">
          <input id="purchaseSearch" type="text" placeholder="搜索商品标题或卖家" style="padding:8px;border:1px solid #ccc;border-radius:6px;width:200px;">
          <button id="btnPurchaseSearch" style="padding:8px 16px;margin-left:8px;background:#4caf50;color:white;border:none;border-radius:6px;cursor:pointer;">搜索</button>
        </div>
        
        <div id="purchaseList" class="purchase-list">
          <p class="empty-message">暂无购买记录</p>
        </div>
      </div>
    </div>
  </div>

  <div class="row" id="discover">
    <div class="card" style="margin-top:16px;">
      <h3 style="display:flex;align-items:center;gap:10px;">最新发布
        <button id="btnMine" style="padding:0 12px;height:32px;line-height:32px;margin-top:3px;">只看我的</button>
        <input id="q" type="text" placeholder="搜索标题/描述" style="flex:1;max-width:260px;padding:6px;border:1px solid #ccc;border-radius:6px;height:32px;">
        <button id="btnSearch" style="padding:0 12px;height:32px;line-height:32px;margin-top:3px;">搜索</button>
        <input id="minP" type="number" min="0" step="0.01" placeholder="最低价" style="width:90px;padding:6px;border:1px solid #ccc;border-radius:6px;height:32px;">
        <input id="maxP" type="number" min="0" step="0.01" placeholder="最高价" style="width:90px;padding:6px;border:1px solid #ccc;border-radius:6px;height:32px;">
        <select id="sort" style="padding:6px;border-radius:6px;border:1px solid #ccc;height:32px;">
          <option value="time_desc">最新发布</option>
          <option value="price_asc">价格从低到高</option>
          <option value="price_desc">价格从高到低</option>
        </select>
      </h3>
      <div id="market" class="market-grid"></div>
    </div>
  </div>

  <script>
    let currentUser = '匿名';

    function contextPath(){
      // 对于直接访问的页面，不需要上下文路径
      return '';
    }
    function assetUrl(p){
      if (!p) return '';
      if (/^https?:\/\//i.test(p)) return p;
      if (p.startsWith('/uploads/')) return p; // 直接使用绝对路径
      if (p.startsWith('uploads/')) return '/' + p; // 补齐前导斜杠
      return p; // 其他相对路径保持不变
    }

    async function fetchCurrent() {
      try {
        const res = await fetch('CurrentUser');
        if (res.ok) {
          const j = await res.json();
          currentUser = j.username || '匿名';
        }
      } catch (_) {}
    }

    async function fetchList(keyword, mineOnly) {
      try {
        const url = mineOnly ? 'TradeMine' : 'TradeList';
        const res = await fetch(url);
        if (!res.ok) {
          console.error('API响应错误:', res.status, res.statusText);
          throw new Error(`网络错误: ${res.status}`);
        }
        let list = await res.json();
        console.log('获取到的数据:', list);
        const q = (keyword||'').trim();
        if (q) {
          list = list.filter(it => (it.title||'').includes(q) || (it.description||'').includes(q));
        }
        const min = parseFloat(document.getElementById('minP').value);
        const max = parseFloat(document.getElementById('maxP').value);
        list = list.filter(it => {
          const p = parseFloat(it.price||0);
          if (!isNaN(min) && p < min) return false;
          if (!isNaN(max) && p > max) return false;
          return true;
        });
        const sort = document.getElementById('sort').value;
        list.sort((a,b)=>{
          if (sort === 'price_asc') return (parseFloat(a.price||0) - parseFloat(b.price||0));
          if (sort === 'price_desc') return (parseFloat(b.price||0) - parseFloat(a.price||0));
          // time_desc
          return new Date(b.date||0) - new Date(a.date||0);
        });
        render(list);
      } catch (error) {
        console.error('获取商品列表失败:', error);
        // 显示错误信息而不是空状态
        const wrap = document.getElementById('market');
        wrap.innerHTML = `<div class="empty">加载失败: ${error.message}</div>`;
      }
    }

    function render(list) {
      const wrap = document.getElementById('market');
      wrap.innerHTML = '';
      if (!list || !list.length) {
        wrap.innerHTML = '<div class="empty">暂无发布，快来成为第一个吧～</div>';
        return;
      }
      list.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        let thumbs = [];
        if (item.images) {
          thumbs = String(item.images).split(',').filter(Boolean);
        } else if (item.img) {
          thumbs = [item.img];
        }
        const imgHtml = thumbs.length ? `<img class="thumb-img" data-full="${assetUrl(thumbs[0])}" src="${assetUrl(thumbs[0])}" alt="">` : '<div class="ph">无图</div>';
        // 判断商品状态和显示相应按钮
        let statusInfo = '';
        let actionButton = '';
        
        if (item.status === 'PENDING') {
          statusInfo = `<div class="status pending">待支付 · 买家: ${escapeHtml(item.buyer || '')}</div>`;
        } else if (item.status === 'CANCELLED') {
          statusInfo = `<div class="status cancelled">已取消</div>`;
        } else {
          // 默认可购买状态，不显示"在售"标签
          if (item.author !== currentUser) {
            actionButton = `<button class="buy-btn" data-id="${item.id}" data-price="${item.price}">购买 ￥${item.price}</button>`;
          }
        }

        el.innerHTML = `
          <div class="thumb">${imgHtml}</div>
          <div class="meta">
            <div class="t"><a class="t-link" href="trade-detail.html?id=${item.id}">${escapeHtml(item.title)}</a></div>
            <div class="p">￥${item.price ?? 0}</div>
            <div class="d">${escapeHtml(item.description || '')}</div>
            ${statusInfo}
            <div class="time">${formatTime(item.date)} ${item.author ? ' · ' + escapeHtml(item.author) : ''}
              ${item.author === currentUser ? ' · <button class="del" data-id="'+item.id+'">删除</button>' : ''}
              ${actionButton}
            </div>
            ${thumbs.length>1 ? `<div class="more-imgs" style="display:flex;gap:6px;margin-top:6px;">${thumbs.slice(1,4).map(p=>`<img class=\"thumb-img\" data-full=\"${assetUrl(p)}\" src=\"${assetUrl(p)}\" style=\"width:48px;height:48px;object-fit:cover;border-radius:4px;cursor:pointer;\">`).join('')}</div>`: ''}
          </div>
        `;
        wrap.appendChild(el);
      });

      // 绑定图片预览
      wrap.querySelectorAll('img.thumb-img').forEach(img => {
        img.style.cursor = 'pointer';
        img.addEventListener('click', ()=>{
          openLightbox(img.getAttribute('data-full') || img.src);
        });
      });

      // 绑定删除
      wrap.querySelectorAll('button.del').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          if (!confirm('确认删除该条目？')) return;
          try {
            const res = await fetch('TradeDelete', { method: 'POST', headers: { 'Content-Type':'application/x-www-form-urlencoded' }, body: 'id='+encodeURIComponent(id) });
            const j = await res.json();
            if (!j.ok) throw new Error(j.msg||'删除失败');
            fetchList(document.getElementById('q').value, mineOnlyState);
          } catch (err) {
            alert('操作失败：' + (err.message||''));
          }
        });
      });

      // 绑定购买按钮
      wrap.querySelectorAll('button.buy-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          const price = e.currentTarget.getAttribute('data-price');
          if (!confirm(`确认购买该商品？价格：￥${price}`)) return;
          try {
            const res = await fetch('TradePay', { method: 'POST', headers: { 'Content-Type':'application/x-www-form-urlencoded' }, body: 'id='+encodeURIComponent(id) });
            const j = await res.json();
            if (!j.ok) throw new Error(j.msg||'支付失败');
            alert('支付成功！');
            fetchList(document.getElementById('q').value, mineOnlyState);
          } catch (err) {
            alert('支付失败：' + (err.message||''));
          }
        });
      });
    }

    function escapeHtml(s){
      if(!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function formatTime(t){
      if(!t) return '';
      try { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; } catch(_) { return t; }
    }

    document.getElementById('sellForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      try {
        const res = await fetch('TradeCreate', { method: 'POST', body: fd });
        const data = await res.json().catch(()=>({ok:false}));
        if (!data.ok) throw new Error(data.msg||'提交失败');
        form.reset();
        fetchList(document.getElementById('q').value, mineOnlyState);
        alert('发布成功');
      } catch (err) {
        alert('发布失败：' + (err.message||''));
      }
    });

    let mineOnlyState = false;
    document.getElementById('btnSearch').addEventListener('click', ()=>{
      fetchList(document.getElementById('q').value, mineOnlyState);
    });
    document.getElementById('btnMine').addEventListener('click', ()=>{
      mineOnlyState = !mineOnlyState;
      document.getElementById('btnMine').textContent = mineOnlyState ? '查看全部' : '只看我的';
      fetchList(document.getElementById('q').value, mineOnlyState);
    });

    // 多图预览与前端校验
    document.getElementById('images').addEventListener('change', function(e){
      const box = document.getElementById('preview');
      box.innerHTML = '';
      const files = Array.from(e.target.files || []);
      const MAX = 10 * 1024 * 1024; // 10MB/张
      files.forEach(f => {
        const tip = document.createElement('div');
        tip.style.width = '72px';
        tip.style.height = '72px';
        tip.style.borderRadius = '6px';
        tip.style.overflow = 'hidden';
        tip.style.display = 'flex';
        tip.style.alignItems = 'center';
        tip.style.justifyContent = 'center';
        tip.style.background = '#f6f6f6';
        if (!f.type.startsWith('image/')) {
          tip.textContent = '非法类型'; tip.style.color = '#b00020';
        } else if (f.size > MAX) {
          tip.textContent = '过大'; tip.style.color = '#b00020';
        } else {
          const img = document.createElement('img');
          img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover';
          img.src = URL.createObjectURL(f);
          tip.appendChild(img);
        }
        box.appendChild(tip);
      });
    });

    // 排序与区间筛选变更时刷新
    ['sort','minP','maxP'].forEach(id => {
      document.getElementById(id).addEventListener('change', ()=>{
        fetchList(document.getElementById('q').value, mineOnlyState);
      });
    });

    function showSection(which){
      const pub = document.getElementById('publish');
      const dis = document.getElementById('discover');
      const rec = document.getElementById('recharge');
      const pur = document.getElementById('purchase-history');
      
      // 隐藏所有section
      pub.style.display = 'none';
      dis.style.display = 'none';
      rec.style.display = 'none';
      pur.style.display = 'none';
      
      if (which === 'publish') {
        pub.style.display = '';
        pub.scrollIntoView({behavior:'smooth'});
        location.hash = 'publish';
      } else if (which === 'recharge') {
        rec.style.display = '';
        rec.scrollIntoView({behavior:'smooth'});
        location.hash = 'recharge';
        loadRechargeData();
      } else if (which === 'purchase-history') {
        pur.style.display = '';
        pur.scrollIntoView({behavior:'smooth'});
        location.hash = 'purchase-history';
        loadPurchaseHistory();
      } else {
        // default show discover only
        dis.style.display = '';
        dis.scrollIntoView({behavior:'smooth'});
        location.hash = 'discover';
      }
    }

    // 顶部导航点击：只显示相应分区
    document.getElementById('navDiscover').addEventListener('click', function(e){ e.preventDefault(); showSection('discover'); });
    document.getElementById('navPublish').addEventListener('click', function(e){ e.preventDefault(); showSection('publish'); });
    document.getElementById('navRecharge').addEventListener('click', function(e){ e.preventDefault(); showSection('recharge'); });
    document.getElementById('navPurchaseHistory').addEventListener('click', function(e){ e.preventDefault(); showSection('purchase-history'); });

    // 充值相关功能
    async function loadRechargeData() {
      await loadUserBalance();
      await loadRechargeHistory();
    }

    async function loadUserBalance() {
      try {
        const res = await fetch('UserBalance');
        const data = await res.json();
        if (data.ok) {
          document.getElementById('currentBalance').textContent = `¥${data.balance}`;
          document.getElementById('balanceDisplay').textContent = `余额: ¥${data.balance}`;
        }
      } catch (err) {
        console.error('获取余额失败:', err);
      }
    }

    async function loadRechargeHistory() {
      try {
        const res = await fetch('RechargeHistory');
        const history = await res.json();
        const historyDiv = document.getElementById('historyList');
        
        if (!history || history.length === 0) {
          historyDiv.innerHTML = '<p>暂无充值记录</p>';
          return;
        }

        let html = '<div class="history-items">';
        history.forEach(item => {
          const statusClass = item.status === 'SUCCESS' ? 'success' : item.status === 'PENDING' ? 'pending' : 'failed';
          const paymentText = item.paymentMethod === 'WECHAT' ? '微信支付' : '支付宝';
          html += `
            <div class="history-item">
              <div class="item-info">
                <span class="amount">¥${item.amount}</span>
                <span class="payment">${paymentText}</span>
                <span class="status ${statusClass}">${getStatusText(item.status)}</span>
              </div>
              <div class="item-time">${item.createTime}</div>
            </div>
          `;
        });
        html += '</div>';
        historyDiv.innerHTML = html;
      } catch (err) {
        console.error('获取充值记录失败:', err);
      }
    }

    function getStatusText(status) {
      switch(status) {
        case 'SUCCESS': return '成功';
        case 'PENDING': return '待支付';
        case 'FAILED': return '失败';
        default: return status;
      }
    }

    // 自定义金额选择
    document.getElementById('rechargeAmount').addEventListener('change', function(e) {
      const customDiv = document.getElementById('customAmountDiv');
      if (e.target.value === 'custom') {
        customDiv.style.display = 'block';
      } else {
        customDiv.style.display = 'none';
      }
    });

    // 测试无效金额格式功能
    function testInvalidAmount() {
      // 故意设置无效格式来触发错误
      document.getElementById('customAmount').value = 'invalid$$$123.abc';
      alert('已设置无效金额格式，点击充值按钮将触发格式错误');
    }

    // 充值表单提交
    document.getElementById('rechargeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      let amount = document.getElementById('rechargeAmount').value;
      if (amount === 'custom') {
        amount = document.getElementById('customAmount').value;
        // 允许无效格式通过前端验证来测试后端错误处理
        if (!amount) {
          alert('请输入充值金额');
          return;
        }
        // 如果包含无效字符，让后端处理并返回格式错误
        if (!/^[0-9.]+$/.test(amount) && !amount.includes('invalid')) {
          if (parseFloat(amount) <= 0) {
            alert('请输入有效的充值金额');
            return;
          }
        }
      }

      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      
      try {
        // 创建充值订单
        const res = await fetch('RechargeCreate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `amount=${encodeURIComponent(amount)}&paymentMethod=${encodeURIComponent(paymentMethod)}`
        });
        
        const data = await res.json();
        if (!data.ok) {
          throw new Error(data.msg || '创建充值订单失败');
        }

        // 模拟支付过程
        if (confirm(`确认使用${paymentMethod === 'WECHAT' ? '微信' : '支付宝'}支付 ¥${amount} 吗？`)) {
          const payRes = await fetch('RechargePay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `orderNo=${encodeURIComponent(data.orderNo)}`
          });
          
          const payData = await payRes.json();
          if (payData.ok) {
            alert('充值成功！');
            loadRechargeData(); // 刷新数据
          } else {
            throw new Error(payData.msg || '支付失败');
          }
        }
        
      } catch (err) {
        alert('充值失败：' + err.message);
      }
    });

    // 购买记录相关功能
    let purchaseHistoryData = [];

    async function loadPurchaseHistory() {
      try {
        const res = await fetch('TradePurchaseHistory');
        purchaseHistoryData = await res.json();
        renderPurchaseHistory(purchaseHistoryData);
        updatePurchaseStats(purchaseHistoryData);
      } catch (err) {
        console.error('获取购买记录失败:', err);
        document.getElementById('purchaseList').innerHTML = '<p class="empty-message">加载购买记录失败</p>';
      }
    }

    function renderPurchaseHistory(data) {
      const listDiv = document.getElementById('purchaseList');
      
      if (!data || data.length === 0) {
        listDiv.innerHTML = '<p class="empty-message">暂无购买记录</p>';
        return;
      }

      let html = '<div class="market-grid">';
      data.forEach(item => {
        let thumbs = [];
        if (item.images) {
          thumbs = String(item.images).split(',').filter(Boolean);
        }
        const imgHtml = thumbs.length ? `<img class="thumb-img" data-full="${assetUrl(thumbs[0])}" src="${assetUrl(thumbs[0])}" alt="">` : '<div class="ph">无图</div>';
        
        html += `
          <div class="item">
            <div class="thumb">${imgHtml}</div>
            <div class="meta">
              <div class="t">${escapeHtml(item.title)}</div>
              <div class="p">￥${item.price || 0}</div>
              <div class="d">${escapeHtml(item.description || '')}</div>
              <div class="status paid">已购买</div>
              <div class="time">购买于 ${formatTime(item.paymentTime)} · 卖家: ${escapeHtml(item.author)}</div>
              ${thumbs.length>1 ? `<div class="more-imgs" style="display:flex;gap:6px;margin-top:6px;">${thumbs.slice(1,4).map(p=>`<img class=\"thumb-img\" data-full=\"${assetUrl(p)}\" src=\"${assetUrl(p)}\" style=\"width:48px;height:48px;object-fit:cover;border-radius:4px;cursor:pointer;\">`).join('')}</div>`: ''}
            </div>
          </div>
        `;
      });
      html += '</div>';
      listDiv.innerHTML = html;

      // 绑定图片预览功能
      listDiv.querySelectorAll('img.thumb-img').forEach(img => {
        img.style.cursor = 'pointer';
        img.addEventListener('click', ()=>{
          openLightbox(img.getAttribute('data-full') || img.src);
        });
      });
    }

    function updatePurchaseStats(data) {
      const totalPurchases = data.length;
      const totalSpent = data.reduce((sum, item) => sum + (parseFloat(item.price) || 0), 0);
      
      document.getElementById('totalPurchases').textContent = totalPurchases;
      document.getElementById('totalSpent').textContent = `¥${totalSpent.toFixed(2)}`;
    }

    // 购买记录搜索
    document.getElementById('btnPurchaseSearch').addEventListener('click', function() {
      const keyword = document.getElementById('purchaseSearch').value.trim().toLowerCase();
      if (!keyword) {
        renderPurchaseHistory(purchaseHistoryData);
        return;
      }
      
      const filtered = purchaseHistoryData.filter(item => 
        (item.title && item.title.toLowerCase().includes(keyword)) ||
        (item.author && item.author.toLowerCase().includes(keyword)) ||
        (item.description && item.description.toLowerCase().includes(keyword))
      );
      
      renderPurchaseHistory(filtered);
    });

    // 购买记录搜索框回车事件
    document.getElementById('purchaseSearch').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('btnPurchaseSearch').click();
      }
    });

    (async function init(){
      await fetchCurrent();
      await loadUserBalance(); // 加载用户余额
      
      // 默认进入交易页只显示"最新发布"
      const h = (location.hash || '').replace('#','');
      if (h === 'publish') showSection('publish'); 
      else if (h === 'recharge') showSection('recharge');
      else if (h === 'purchase-history') showSection('purchase-history');
      else showSection('discover');
      fetchList();
    })();
  </script>

  <!-- Lightbox 预览弹层 -->
  <div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center;">
    <div style="position:relative;max-width:90%;max-height:90%;display:flex;flex-direction:column;align-items:center;">
      <img id="lbImg" src="" style="max-width:100%;max-height:80vh;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);" />
      <div style="margin-top:10px;display:flex;gap:12px;">
        <a id="lbDownload" href="#" download style="padding:8px 12px;background:#fff;border-radius:6px;color:#333;text-decoration:none;">下载原图</a>
        <button onclick="closeLightbox()" style="padding:8px 12px;border-radius:6px;border:none;">关闭</button>
      </div>
      <button onclick="closeLightbox()" style="position:absolute;right:-6px;top:-6px;background:#fff;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;">✕</button>
    </div>
  </div>

  <script>
    function openLightbox(url){
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lbImg');
      const dl = document.getElementById('lbDownload');
      img.src = url;
      dl.href = url;
      lb.style.display = 'flex';
    }
    function closeLightbox(){
      document.getElementById('lightbox').style.display = 'none';
    }
    // 点击遮罩关闭
    document.addEventListener('click', function(e){
      const lb = document.getElementById('lightbox');
      if (e.target === lb) closeLightbox();
    });
  </script>

  <div class="footer">
    <h2>Nothing Is Impossible</h2>
  </div>
</div>
</body>
</html>
