<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品详情 - 校园贴吧</title>
  <link rel="stylesheet" href="css/css/universal.css" />
  <link rel="stylesheet" href="css/css/modern-components.css" />
  <link rel="stylesheet" href="css/css/trade.css" />
  <script src="js/jquery-3.5.1.min.js"></script>
  <style>
    .detail-wrap{display:flex;gap:16px;flex-wrap:wrap}
    .detail-gallery{flex:0 0 360px}
    .detail-gallery img{width:100%;border-radius:8px;object-fit:cover}
    .detail-thumbs{display:flex;gap:8px;margin-top:8px}
    .detail-thumbs img{width:64px;height:64px;border-radius:6px;object-fit:cover;cursor:pointer}
    .detail-main{flex:1;min-width:280px}
    .comment-form textarea{width:100%;min-height:80px}
    .comment-item{padding:10px 0;border-bottom:1px solid #eee}
    .like{margin-left:8px;cursor:pointer}
    .t-link{color:#333;text-decoration:none}
  </style>
  <script src="js/modern-interactions.js"></script>
</head>
<body>
<div class="container">
  <div class="topnav">
    <ul>
      <li><a href="home.jsp">主页</a></li>
      <li><a href="trade.html#discover">返回发现</a></li>
    </ul>
  </div>

  <div class="row">
    <div class="card">
      <div id="detail" class="detail-wrap">
        <div class="detail-gallery">
          <img id="hero" src="" alt="商品图片">
          <div id="thumbs" class="detail-thumbs"></div>
        </div>
        <div class="detail-main">
          <h2 id="title"></h2>
          <div style="font-size:20px;color:#d23;font-weight:600;">￥<span id="price">0</span></div>
          <div id="meta" style="margin-top:6px;color:#666"></div>
          <div style="margin-top:12px;white-space:pre-wrap;" id="desc"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <h3>评论</h3>
      <div id="comments"></div>
      <div class="comment-form" style="margin-top:10px;">
        <form id="commentForm">
          <textarea name="content" id="cmtContent" required placeholder="说点什么…"></textarea>
          <div style="margin-top:6px;text-align:right">
            <button type="submit">发表</button>
          </div>
        </form>
    </div>
  </div>

  <script>
    function qs(name){ const u=new URL(location.href); return u.searchParams.get(name); }
    function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }
    function contextPath(){
      // 对于直接访问的页面，不需要上下文路径
      return '';
    }
    function assetUrl(p){
      if (!p) return '';
      if (/^https?:\/\//i.test(p)) return p;
      if (p.startsWith('/uploads/')) return p; // 直接使用绝对路径
      if (p.startsWith('uploads/')) return '/' + p; // 补齐前导斜杠
      return p; // 其他相对路径保持不变
    }
    const id = qs('id');

    async function loadDetail(){
      const res = await fetch('TradeGet?id='+encodeURIComponent(id));
      const j = await res.json();
      if (!j.ok) { alert('加载失败'); return; }
      const d = j.data;
      document.getElementById('title').textContent = d.title;
      document.getElementById('price').textContent = d.price;
      document.getElementById('desc').textContent = d.description || '';
      document.getElementById('meta').textContent = (d.author?d.author+' · ':'') + (d.date||'');
      const images = (d.images||'').split(',').filter(Boolean);
      const hero = document.getElementById('hero');
      const thumbs = document.getElementById('thumbs');
      if (images.length) {
        hero.src = assetUrl(images[0]);
        thumbs.innerHTML = images.map((p,i)=>`<img data-idx="${i}" src="${assetUrl(p)}">`).join('');
        thumbs.querySelectorAll('img').forEach(img=>{
          img.addEventListener('click', ()=>{ hero.src = img.src; });
        });
      } else {
        hero.src = 'images/placeholder.png';
      }
    }

    async function loadComments(){
      const res = await fetch('CommentList?post_id='+encodeURIComponent(id));
      const j = await res.json();
      const box = document.getElementById('comments');
      if (!j.ok) { box.innerHTML = '<div class="empty">加载失败</div>'; return; }
      if (!j.data || !j.data.length) { box.innerHTML = '<div class="empty">暂无评论</div>'; return; }
      box.innerHTML = '';
      j.data.forEach(c=>{
        const el = document.createElement('div');
        el.className = 'comment-item';
        el.innerHTML = `
          <div style="color:#333;font-weight:600;">${esc(c.author||'匿名')} <span style="color:#999;font-weight:400;margin-left:6px;">${esc(c.date||'')}</span></div>
          <div style="margin-top:4px;">${esc(c.content||'')}</div>
          <div style="margin-top:6px;color:#666;">
            <button class="btn-like" data-id="${c.id}" style="padding:2px 8px;">👍 <span class="num">${c.likes||0}</span></button>
          </div>
        `;
        box.appendChild(el);
      });
      box.querySelectorAll('.btn-like').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          try{
            const cid = btn.getAttribute('data-id');
            const res = await fetch('TradeToggleCommentLike', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'comment_id='+encodeURIComponent(cid)});
            if (res.status === 401) { if (confirm('请先登录后再点赞，是否前往登录？')) { location.href = 'index.html?redirect='+encodeURIComponent(location.pathname+location.search); } return; }
            const j = await res.json();
            if (!j.ok) throw new Error(j.msg||'');
            btn.querySelector('.num').textContent = j.likes;
          }catch(e){ alert('点赞失败'); }
        });
      });
    }

    document.getElementById('commentForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const content = document.getElementById('cmtContent').value.trim();
      if (!content) return;
      try {
        const res = await fetch('TradeCommentAdd', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'post_id='+encodeURIComponent(id)+'&content='+encodeURIComponent(content)});
        if (res.status === 401) { if (confirm('请先登录后再发表评论，是否前往登录？')) { location.href = 'index.html?redirect='+encodeURIComponent(location.pathname+location.search); } return; }
        if (!res.ok) throw new Error();
        document.getElementById('cmtContent').value = '';
        loadComments();
      } catch (e) { alert('发表评论失败'); }
    });

    (async function(){
      if (!id) { alert('缺少id'); return; }
      await loadDetail();
      await loadComments();
    })();
  </script>

  <div class="footer">
    <h2>Nothing Is Impossible</h2>
  </div>
</div>
</body>
</html>
