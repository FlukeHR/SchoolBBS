<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="rogepi" />
  <title>二手交易平台 - 校园贴吧</title>
  <link rel="icon" href="images/trade.png" type="image/x-icon" />
  <link rel="stylesheet" href="css/css/universal.css" />
  <link rel="stylesheet" href="css/css/modern-components.css" />
  <link rel="stylesheet" href="css/css/trade.css" />
  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/modern-interactions.js"></script>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>二手交易平台</h1>
    <p>闲置不闲，循环更美好</p>
  </div>

  <div class="topnav">
    <ul>
      <li><a href="home.jsp">主页</a></li>
      <li><a href="#discover" id="navDiscover">发现</a></li>
      <li><a href="#publish" id="navPublish">发布</a></li>
    </ul>
  </div>

  <div class="row" id="publish">
    <div class="card">
      <h3>发布出售信息</h3>
      <div class="trade-form">
        <form id="sellForm" action="TradeCreate" method="post" enctype="multipart/form-data">
          <label>商品标题：<input type="text" id="title" name="title" required></label>
          <label>价格（元）：<input type="number" id="price" name="price" min="0" step="0.01" required></label>
          <label>商品描述：<textarea id="desc" name="desc" rows="5" required></textarea></label>
          <label>上传图片（可选）：
            <input type="file" id="images" name="images" accept="image/*" multiple>
            <div id="preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;"></div>
          </label>
          <button type="submit">发布</button>
        </form>
      </div>
    </div>
  </div>

  <div class="row" id="discover">
    <div class="card" style="margin-top:16px;">
      <h3 style="display:flex;align-items:center;gap:10px;">最新发布
        <button id="btnMine" style="padding:0 12px;height:32px;line-height:32px;margin-top:3px;">只看我的</button>
        <input id="q" type="text" placeholder="搜索标题/描述" style="flex:1;max-width:260px;padding:6px;border:1px solid #ccc;border-radius:6px;height:32px;">
        <button id="btnSearch" style="padding:0 12px;height:32px;line-height:32px;margin-top:3px;">搜索</button>
        <input id="minP" type="number" min="0" step="0.01" placeholder="最低价" style="width:90px;padding:6px;border:1px solid #ccc;border-radius:6px;height:32px;">
        <input id="maxP" type="number" min="0" step="0.01" placeholder="最高价" style="width:90px;padding:6px;border:1px solid #ccc;border-radius:6px;height:32px;">
        <select id="sort" style="padding:6px;border-radius:6px;border:1px solid #ccc;height:32px;">
          <option value="time_desc">最新发布</option>
          <option value="price_asc">价格从低到高</option>
          <option value="price_desc">价格从高到低</option>
        </select>
      </h3>
      <div id="market" class="market-grid"></div>
    </div>
  </div>

  <script>
    let currentUser = '匿名';

    function contextPath(){
      const parts = location.pathname.split('/').filter(Boolean);
      return parts.length ? ('/' + parts[0]) : '';
    }
    function assetUrl(p){
      if (!p) return '';
      if (/^https?:\/\//i.test(p)) return p;
      if (p.startsWith('/uploads/')) return contextPath() + p;
      if (p.startsWith('uploads/')) return contextPath() + '/' + p;
      return p; // 其他相对路径保持不变
    }

    async function fetchCurrent() {
      try {
        const res = await fetch('CurrentUser');
        if (res.ok) {
          const j = await res.json();
          currentUser = j.username || '匿名';
        }
      } catch (_) {}
    }

    async function fetchList(keyword, mineOnly) {
      try {
        const url = mineOnly ? 'TradeMine' : 'TradeList';
        const res = await fetch(url);
        if (!res.ok) throw new Error('网络错误');
        let list = await res.json();
        const q = (keyword||'').trim();
        if (q) {
          list = list.filter(it => (it.title||'').includes(q) || (it.description||'').includes(q));
        }
        const min = parseFloat(document.getElementById('minP').value);
        const max = parseFloat(document.getElementById('maxP').value);
        list = list.filter(it => {
          const p = parseFloat(it.price||0);
          if (!isNaN(min) && p < min) return false;
          if (!isNaN(max) && p > max) return false;
          return true;
        });
        const sort = document.getElementById('sort').value;
        list.sort((a,b)=>{
          if (sort === 'price_asc') return (parseFloat(a.price||0) - parseFloat(b.price||0));
          if (sort === 'price_desc') return (parseFloat(b.price||0) - parseFloat(a.price||0));
          // time_desc
          return new Date(b.date||0) - new Date(a.date||0);
        });
        render(list);
      } catch (_) {
        // 降级：无后端时展示空态
        render([]);
      }
    }

    function render(list) {
      const wrap = document.getElementById('market');
      wrap.innerHTML = '';
      if (!list || !list.length) {
        wrap.innerHTML = '<div class="empty">暂无发布，快来成为第一个吧～</div>';
        return;
      }
      list.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        let thumbs = [];
        if (item.images) {
          thumbs = String(item.images).split(',').filter(Boolean);
        } else if (item.img) {
          thumbs = [item.img];
        }
        const imgHtml = thumbs.length ? `<img class="thumb-img" data-full="${assetUrl(thumbs[0])}" src="${assetUrl(thumbs[0])}" alt="">` : '<div class="ph">无图</div>';
        el.innerHTML = `
          <div class="thumb">${imgHtml}</div>
          <div class="meta">
            <div class="t"><a class="t-link" href="trade-detail.html?id=${item.id}">${escapeHtml(item.title)}</a></div>
            <div class="p">￥${item.price ?? 0}</div>
            <div class="d">${escapeHtml(item.description || '')}</div>
            <div class="time">${formatTime(item.date)} ${item.author ? ' · ' + escapeHtml(item.author) : ''}
              ${item.author === currentUser ? ' · <button class="del" data-id="'+item.id+'">删除</button>' : ''}
            </div>
            ${thumbs.length>1 ? `<div class="more-imgs" style="display:flex;gap:6px;margin-top:6px;">${thumbs.slice(1,4).map(p=>`<img class=\"thumb-img\" data-full=\"${assetUrl(p)}\" src=\"${assetUrl(p)}\" style=\"width:48px;height:48px;object-fit:cover;border-radius:4px;cursor:pointer;\">`).join('')}</div>`: ''}
          </div>
        `;
        wrap.appendChild(el);
      });

      // 绑定图片预览
      wrap.querySelectorAll('img.thumb-img').forEach(img => {
        img.style.cursor = 'pointer';
        img.addEventListener('click', ()=>{
          openLightbox(img.getAttribute('data-full') || img.src);
        });
      });

      // 绑定删除
      wrap.querySelectorAll('button.del').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          if (!confirm('确认删除该条目？')) return;
          try {
            const res = await fetch('TradeDelete', { method: 'POST', headers: { 'Content-Type':'application/x-www-form-urlencoded' }, body: 'id='+encodeURIComponent(id) });
            const j = await res.json();
            if (!j.ok) throw new Error(j.msg||'删除失败');
            fetchList(document.getElementById('q').value, mineOnlyState);
          } catch (err) {
            alert('操作失败：' + (err.message||''));
          }
        });
      });
    }

    function escapeHtml(s){
      if(!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function formatTime(t){
      if(!t) return '';
      try { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; } catch(_) { return t; }
    }

    document.getElementById('sellForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      try {
        const res = await fetch('TradeCreate', { method: 'POST', body: fd });
        const data = await res.json().catch(()=>({ok:false}));
        if (!data.ok) throw new Error(data.msg||'提交失败');
        form.reset();
        fetchList(document.getElementById('q').value, mineOnlyState);
        alert('发布成功');
      } catch (err) {
        alert('发布失败：' + (err.message||''));
      }
    });

    let mineOnlyState = false;
    document.getElementById('btnSearch').addEventListener('click', ()=>{
      fetchList(document.getElementById('q').value, mineOnlyState);
    });
    document.getElementById('btnMine').addEventListener('click', ()=>{
      mineOnlyState = !mineOnlyState;
      document.getElementById('btnMine').textContent = mineOnlyState ? '查看全部' : '只看我的';
      fetchList(document.getElementById('q').value, mineOnlyState);
    });

    // 多图预览与前端校验
    document.getElementById('images').addEventListener('change', function(e){
      const box = document.getElementById('preview');
      box.innerHTML = '';
      const files = Array.from(e.target.files || []);
      const MAX = 10 * 1024 * 1024; // 10MB/张
      files.forEach(f => {
        const tip = document.createElement('div');
        tip.style.width = '72px';
        tip.style.height = '72px';
        tip.style.borderRadius = '6px';
        tip.style.overflow = 'hidden';
        tip.style.display = 'flex';
        tip.style.alignItems = 'center';
        tip.style.justifyContent = 'center';
        tip.style.background = '#f6f6f6';
        if (!f.type.startsWith('image/')) {
          tip.textContent = '非法类型'; tip.style.color = '#b00020';
        } else if (f.size > MAX) {
          tip.textContent = '过大'; tip.style.color = '#b00020';
        } else {
          const img = document.createElement('img');
          img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover';
          img.src = URL.createObjectURL(f);
          tip.appendChild(img);
        }
        box.appendChild(tip);
      });
    });

    // 排序与区间筛选变更时刷新
    ['sort','minP','maxP'].forEach(id => {
      document.getElementById(id).addEventListener('change', ()=>{
        fetchList(document.getElementById('q').value, mineOnlyState);
      });
    });

    function showSection(which){
      const pub = document.getElementById('publish');
      const dis = document.getElementById('discover');
      if (which === 'publish') {
        pub.style.display = '';
        dis.style.display = 'none';
        pub.scrollIntoView({behavior:'smooth'});
        location.hash = 'publish';
      } else {
        // default show discover only
        pub.style.display = 'none';
        dis.style.display = '';
        dis.scrollIntoView({behavior:'smooth'});
        location.hash = 'discover';
      }
    }

    // 顶部导航点击：只显示相应分区
    document.getElementById('navDiscover').addEventListener('click', function(e){ e.preventDefault(); showSection('discover'); });
    document.getElementById('navPublish').addEventListener('click', function(e){ e.preventDefault(); showSection('publish'); });

    (async function init(){
      await fetchCurrent();
      // 默认进入交易页只显示“最新发布”
      const h = (location.hash || '').replace('#','');
      if (h === 'publish') showSection('publish'); else showSection('discover');
      fetchList();
    })();
  </script>

  <!-- Lightbox 预览弹层 -->
  <div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center;">
    <div style="position:relative;max-width:90%;max-height:90%;display:flex;flex-direction:column;align-items:center;">
      <img id="lbImg" src="" style="max-width:100%;max-height:80vh;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);" />
      <div style="margin-top:10px;display:flex;gap:12px;">
        <a id="lbDownload" href="#" download style="padding:8px 12px;background:#fff;border-radius:6px;color:#333;text-decoration:none;">下载原图</a>
        <button onclick="closeLightbox()" style="padding:8px 12px;border-radius:6px;border:none;">关闭</button>
      </div>
      <button onclick="closeLightbox()" style="position:absolute;right:-6px;top:-6px;background:#fff;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;">✕</button>
    </div>
  </div>

  <script>
    function openLightbox(url){
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lbImg');
      const dl = document.getElementById('lbDownload');
      img.src = url;
      dl.href = url;
      lb.style.display = 'flex';
    }
    function closeLightbox(){
      document.getElementById('lightbox').style.display = 'none';
    }
    // 点击遮罩关闭
    document.addEventListener('click', function(e){
      const lb = document.getElementById('lightbox');
      if (e.target === lb) closeLightbox();
    });
  </script>

  <div class="footer">
    <h2>Nothing Is Impossible</h2>
  </div>
</div>
</body>
</html>
