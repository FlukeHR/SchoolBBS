<!DOCTYPE html>

<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="author" content="rogepi" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/css/universal.css" />
  <link rel="stylesheet" href="css/css/modern-components.css" />
  <link rel="stylesheet" href="css/css/about.css" />
  <link rel="stylesheet" href="css/css/index.css" />
  <link rel="stylesheet" href="css/css/signup.css" />

  <title>校园贴吧</title>
  <link rel="icon" href="images/register.png" type="image/x-icon" />
  <script src="js/modern-interactions.js"></script>
</head>
<body>
<div class="container">
<div class="header">
  <h1>校园贴吧</h1>
  <p>Everything happens for a reason</p>
</div>

<div class="topnav">
  <ul>
    <li><a href="#">首页</a></li>
    <li><a href="#">我的</a></li>
    <li><a href="#">发帖</a></li>
    <li><a href="#">个人资料</a></li>
    <li><a href="#">搜索</a></li>
    <li><a href="index.html">登录</a></li>
  </ul>
</div>

<div class="row">
  <div class="card">
    <h3>注册</h3>
    <br>
    <div class="login" style="height: auto !important; overflow: visible !important;">
      <form action="SignCheck" method="post" style="display: flex; flex-direction: column; gap: 16px; align-items: center; min-height: 300px;">
        <div style="width: 100%; text-align: center; display: block !important;">
          <label style="display: block !important; margin-bottom: 8px; visibility: visible !important;">用户名：<input type="text" name="username" style="display: inline-block !important; width: 200px; visibility: visible !important;"></label>
        </div>
        <div style="width: 100%; text-align: center; display: block !important;">
          <label style="display: block !important; margin-bottom: 8px; visibility: visible !important;">密 码：<input type="password" name="userpwd" style="display: inline-block !important; width: 200px; visibility: visible !important;"></label>
        </div>
        <div style="width: 100%; text-align: center; display: block !important;">
          <label style="display: block !important; margin-bottom: 8px; visibility: visible !important;">重 复：<input type="password" name="reuserpwd" style="display: inline-block !important; width: 200px; visibility: visible !important;"></label>
        </div>
        <div style="width: 100%; text-align: center; display: block !important;">
          <label style="display: block !important; margin-bottom: 8px; visibility: visible !important;">性 别：
            <select name="sex" style="display: inline-block !important; width: 200px; visibility: visible !important;">
              <option>男</option>
              <option>女</option>
            </select>
          </label>
        </div>
        <button type="submit" style="display: inline-block !important; visibility: visible !important;">注册</button>
      </form>
    </div>
    <br>
    <a href="./index.html">登录界面</a>
  </div>
</div>

<div class="footer">
  <h2>Nothing Is Impossible</h2>
</div>

</div>
</body>

</html>
