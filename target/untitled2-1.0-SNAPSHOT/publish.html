<!DOCTYPE html>

<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="author" content="rogepi" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/css/universal.css" />
  <link rel="stylesheet" href="css/css/modern-components.css" />
  <link rel="stylesheet" href="css/css/about.css" />
  <link rel="stylesheet" href="css/css/publish.css" />
  <title>校园贴吧</title>
  <link rel="icon" href="images/post.png" type="image/x-icon" />
  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/modern-interactions.js"></script>
</head>

<body>
<div class="container">
<div class="header">
  <h1>校园贴吧</h1>
</div>

<div class="topnav">
  <ul>
    <li><a href="home.jsp">首页</a></li>
    <li><a href="mine.jsp">我的</a></li>
    <li><a href="publish.html">发帖</a></li>
    <li><a href="about.jsp">个人资料</a></li>
    <li><a href="search.jsp">搜索</a></li>
    <li><a href="smile.html">退出登录</a></li>
  </ul>
</div>

<div class="row">
  <div class="card">
    <h3>编辑</h3>
    <br>
    <div class="edit">
      <form action="PostWrite" method="POST" enctype="multipart/form-data" id="postForm">
        <br>
        <label>贴子标题：<input type="text" name="title" required></label>
        <br><br>
        <label>贴子类型：
          <div id="typeOptions">
            <!-- 动态加载类型（不再保留固定的三个） -->
          </div>
          <br>
          <input type="text" id="customType" placeholder="或输入自定义类型" style="margin-top:10px;">
          <button type="button" onclick="addCustomType()" style="margin-left:5px;">添加类型</button>
        </label>
        <br><br>
        <label>贴子内容：<br>
          <textarea rows="10" name="content" required></textarea>
        </label>
        <br><br>
        <label>上传文件（可选）：<br>
          <input type="file" name="mediaFiles" id="mediaFiles" multiple
                 accept="image/*,video/*,text/plain,application/zip,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,.txt,.zip,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx"
                 style="margin-top:10px;">
          <br><small style="color:#666;">支持多个文件（图片/视频/文档），最大50MB</small>
          <ul id="fileList" style="margin-top:6px;color:#333;padding-left:18px;"></ul>
        </label>
        <br><br>
        <button type="submit">发布</button>
      </form>
    </div>
  </div>
</div>

<script>
// 页面加载时获取所有贴子类型
$(document).ready(function() {
  loadPostTypes();
  // 绑定上传文件选择事件，做前端校验与预览
  $('#mediaFiles').on('change', handleFileChange);
});

function loadPostTypes() {
  $.ajax({
    url: 'GetPostTypes',
    type: 'GET',
    dataType: 'json',
    success: function(data) {
      var typeOptions = $('#typeOptions');
      typeOptions.empty();
      if (Array.isArray(data) && data.length > 0) {
        data.forEach(function(type, idx) {
          var radioId = 'type_' + type.id;
          var checked = idx === 0 ? ' checked' : '';
          var radioHtml = '<input type="radio" id="' + radioId + '" name="ntype" value="' + type.typeName + '"'+checked+' required>' +
                          '<label for="' + radioId + '">' + type.typeName + '</label> ';
          typeOptions.append(radioHtml);
        });
      } else {
        // 没有类型时不显示默认项，用户可通过“添加类型”创建
      }
    },
    error: function(xhr, status, error) {
      console.log('加载类型失败：' + error);
    }
  });
}

// 上传文件前端校验与预览
function handleFileChange(e) {
  const listEl = document.getElementById('fileList');
  listEl.innerHTML = '';
  const files = e.target.files;
  if (!files || files.length === 0) return;

  const maxSize = 50 * 1024 * 1024; // 50MB
  const allowedExt = ['.txt','.zip','.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx'];
  const allowedMime = [
    'image/', 'video/', 'text/plain', 'application/zip', 'application/pdf',
    'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
    'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    'application/vnd.ms-powerpoint', 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
  ];

  const bad = [];
  Array.from(files).forEach(f => {
    const name = f.name || '';
    const lower = name.toLowerCase();
    const ext = lower.slice(lower.lastIndexOf('.'));
    const type = f.type || '';
    const okByMime = allowedMime.some(m => type.startsWith(m));
    const okByExt = allowedExt.includes(ext);
    const ok = okByMime || okByExt;
    const sizeOk = f.size <= maxSize;

    const li = document.createElement('li');
    li.textContent = `${name} (${(f.size/1024).toFixed(1)} KB)`;
    if (!ok) { li.style.color = '#b00020'; li.textContent += ' - 不支持的类型'; bad.push(name); }
    if (!sizeOk) { li.style.color = '#b00020'; li.textContent += ' - 超过50MB'; bad.push(name); }
    listEl.appendChild(li);
  });

  if (bad.length > 0) {
    alert('部分文件不符合要求，已标红提示。如需继续，请移除不符合的文件。');
  }
}

function addCustomType() {
  var typeName = $('#customType').val().trim();
  if (!typeName) {
    alert('请输入类型名称');
    return;
  }
  
  // 检查是否已存在
  var exists = false;
  $('#typeOptions input[type="radio"]').each(function() {
    if ($(this).val() === typeName) {
      exists = true;
    }
  });
  
  if (exists) {
    alert('该类型已存在');
    return;
  }
  
  // 发送请求创建新类型
  $.ajax({
    url: 'PostTypeCreate',
    type: 'POST',
    data: {
      typeName: typeName,
      description: '用户自定义类型'
    },
    success: function(response) {
      if (response.indexOf('成功') > -1) {
        // 添加到选项中
        var radioId = 'type_custom_' + Date.now();
        var radioHtml = '<input type="radio" id="' + radioId + '" name="ntype" value="' + typeName + '" checked required>' +
                      '<label for="' + radioId + '">' + typeName + '</label> ';
        $('#typeOptions').append(radioHtml);
        $('#customType').val('');
        alert('类型添加成功！');
      }
    },
    error: function() {
      alert('添加类型失败，请重试');
    }
  });
}
</script>

<div class="footer">
  <h2>Nothing Is Impossible</h2>
</div>

</div>
</body>

</html>
